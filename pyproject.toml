[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # bugbear
  "SIM",  # simplify
  "D",    # pydocstyle
  "ASYNC",
  "RUF",
]
ignore = [
  "D203",  # incompatible with D211
  "D213",  # incompatible with D212
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
