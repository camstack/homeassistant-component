name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # HACS and hassfest move under us; a weekly run is how a break is found
    # before an operator finds it.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  tests:
    # Each Python version pins a different Home Assistant generation, so this
    # matrix is what proves the integration works on both.
    name: pytest (HA via py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements_test.txt
      - run: pytest --cov=custom_components/camstack --cov-report=term-missing

  release:
    name: release
    runs-on: ubuntu-latest
    needs: [hassfest, hacs, lint, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout (full history, so existing tags are visible)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Decide the version to release
        id: version
        # The version in VERSION is released as-is the first time it is seen.
        # Bumping unconditionally would mean the version this repo declares is
        # never the version anyone can install.
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\n' < VERSION)
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            node scripts/bump-version.js patch
            VERSION=$(tr -d '\n' < VERSION)
          fi
          node scripts/sync-version.js
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit the version bump, if there is one
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION custom_components/camstack/manifest.json package.json addon/camstack/config.yaml
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: release ${{ steps.version.outputs.version }} [skip ci]"
            git push origin main
          fi

      - name: Tag
        run: |
          set -euo pipefail
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: GitHub Release
        # HACS installs from a release. Without one it falls back to the commit
        # SHA and refuses the integration outright.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
